name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # "|" falls back to fetching straight from the VCS on ANY proxy error, not just 404.
  GOPROXY: https://proxy.golang.org|direct

permissions:
  contents: read

jobs:
  test:
    name: Go tests (macOS)
    # macOS has every CGO dependency (Cocoa, CoreGraphics) preinstalled.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download Go modules (retry on proxy errors)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            go mod download && exit 0
            echo "go mod download failed (attempt $i), retrying..."
            sleep $((i * 5))
          done
          exit 1
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  windows:
    name: Windows cross-compile (no CGO)
    runs-on: ubuntu-latest
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download Go modules (retry on proxy errors)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            go mod download && exit 0
            echo "go mod download failed (attempt $i), retrying..."
            sleep $((i * 5))
          done
          exit 1
      - name: Vet
        run: go vet -tags desktop,production ./...
      - name: Build
        run: go build -tags desktop,production -o /dev/null .

  frontend:
    name: Frontend build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download Go modules (retry on proxy errors)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            go mod download && exit 0
            echo "go mod download failed (attempt $i), retrying..."
            sleep $((i * 5))
          done
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Generate TS bindings
        run: wails generate module
      - name: Type-check and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

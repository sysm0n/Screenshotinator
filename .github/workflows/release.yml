name: Release

on:
  push:
    tags: ["v*"]

env:
  # "|" falls back to fetching straight from the VCS on ANY proxy error, not just 404.
  GOPROXY: https://proxy.golang.org|direct

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            asset: screenshotinator-macos-universal.zip
          - os: windows-latest
            platform: windows/amd64
            asset: screenshotinator-windows-amd64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download Go modules (retry on proxy errors)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            go mod download && exit 0
            echo "go mod download failed (attempt $i), retrying..."
            sleep $((i * 5))
          done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build
        run: wails build -clean -platform ${{ matrix.platform }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/bin/screenshotinator.app ${{ matrix.asset }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path build/bin/screenshotinator.exe -DestinationPath ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true

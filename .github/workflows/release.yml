name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            asset: screenshotinator-macos-universal.zip
          - os: windows-latest
            platform: windows/amd64
            asset: screenshotinator-windows-amd64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build
        run: wails build -clean -platform ${{ matrix.platform }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/bin/screenshotinator.app ${{ matrix.asset }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path build/bin/screenshotinator.exe -DestinationPath ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
